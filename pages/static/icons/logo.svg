<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e2b29" />
      <stop offset="50%" stop-color="#232221" />
      <stop offset="100%" stop-color="#181a1b" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ec07c" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#83a598" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#504945" stop-opacity="0.4" />
    </linearGradient>

    <!-- Accent Ribbon Gradients -->
    <linearGradient id="wing-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ec07c" />
      <stop offset="60%" stop-color="#83a598" />
      <stop offset="100%" stop-color="#458588" />
    </linearGradient>
    <linearGradient id="wing-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8bb26" />
      <stop offset="50%" stop-color="#8ec07c" />
      <stop offset="100%" stop-color="#83a598" />
    </linearGradient>
    <linearGradient id="core-sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbf1c7" />
      <stop offset="60%" stop-color="#fabd2f" />
      <stop offset="100%" stop-color="#8ec07c" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="center-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ec07c" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#83a598" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1d2021" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="118" fill="url(#bg-grad)" stroke="#3c3836" stroke-width="6" />
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="url(#border-grad)" stroke-width="2.5" opacity="0.8" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#center-ambient)" filter="url(#glow)" />

  <!-- Outer Orbital / Terminal Bracket Accents -->
  <g opacity="0.22" stroke="#ebdbb2" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 170 100 A 176 176 0 0 0 100 210" />
    <path d="M 342 100 A 176 176 0 0 1 412 210" />
    <path d="M 100 302 A 176 176 0 0 0 170 412" />
    <path d="M 412 302 A 176 176 0 0 1 342 412" />
    <circle cx="256" cy="80" r="3" fill="#8ec07c" />
    <circle cx="256" cy="432" r="3" fill="#83a598" />
  </g>

  <!-- Main Copilot Neural Loops -->
  <g filter="url(#glow)">
    <!-- Left Wing Ribbon: Dynamic sweeping curve with terminal Chevron cue -->
    <path d="M 256 160 C 180 160 110 200 110 260 C 110 320 170 354 226 354 C 274 354 308 326 338 290 C 314 290 286 312 244 312 C 204 312 164 286 164 256 C 164 220 206 196 256 196 Z" fill="url(#wing-left)" opacity="0.95" />

    <!-- Right Wing Ribbon: Interlocking and lifting upwards -->
    <path d="M 256 352 C 332 352 402 312 402 252 C 402 192 342 158 286 158 C 238 158 204 186 174 222 C 198 222 226 200 268 200 C 308 200 348 226 348 256 C 348 292 306 316 256 316 Z" fill="url(#wing-right)" opacity="0.9" />

    <!-- Terminal Code Chevrons - Left "<" / Right ">" Integration -->
    <path d="M 148 236 L 126 256 L 148 276" fill="none" stroke="#fbf1c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M 364 236 L 386 256 L 364 276" fill="none" stroke="#fbf1c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Center Intelligence Core Sparkle -->
    <path d="M 256 175 C 256 220 230 256 185 256 C 230 256 256 292 256 337 C 256 292 282 256 327 256 C 282 256 256 220 256 175 Z" fill="url(#core-sparkle)" />
    
    <!-- Inner Core Nucleus -->
    <circle cx="256" cy="256" r="14" fill="#fbf1c7" />
    <circle cx="256" cy="256" r="6" fill="#1d2021" />

    <!-- Orbiting Accent Sparks -->
    <circle cx="340" cy="168" r="7" fill="#b8bb26" />
    <circle cx="172" cy="344" r="6" fill="#83a598" />
  </g>
</svg>